<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Premier League Tracker</title>
  <!-- Favicon as data URI (no extra HTTP request) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='85' font-size='80' text-anchor='middle' fill='%2315803d'%3E⚽%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      theme: {
        fontFamily: {
          sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'sans-serif'],
        },
      }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-900">

<div class="max-w-7xl mx-auto px-4 py-6">
  <header class="text-center mb-8">
    <h1 id="season-label" class="text-3xl md:text-4xl font-bold text-green-700">⚽ Premier League</h1>
    <p class="text-gray-600 text-sm mt-1">Live table, fixtures & results — low-data mode</p>
    <div class="flex justify-between items-center mt-3 text-xs text-gray-500">
      <span id="last-updated">Loading...</span>
      <button id="refresh-btn" class="bg-green-600 text-white px-3 py-1 rounded-full hover:bg-green-700">↻ Refresh</button>
    </div>
  </header>

  <!-- Tab navigation -->
  <div class="flex flex-wrap gap-2 border-b border-gray-300 mb-6">
    <button data-tab="standings" class="tab-btn py-2 px-4 font-semibold text-green-700 border-b-2 border-green-700">🏆 Table</button>
    <button data-tab="matches" class="tab-btn py-2 px-4 font-semibold text-gray-600 hover:text-green-600">📅 Fixtures & Results</button>
  </div>

  <!-- Standings view -->
  <div id="standings-view" class="tab-content">
    <div class="bg-white rounded-lg shadow overflow-x-auto">
      <table class="league-table w-full text-sm">
        <thead class="bg-green-100 text-green-900">
          <tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>
        </thead>
        <tbody id="standings-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Matches view -->
  <div id="matches-view" class="tab-content hidden">
    <div class="space-y-4">
      <!-- matches injected here -->
    </div>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
